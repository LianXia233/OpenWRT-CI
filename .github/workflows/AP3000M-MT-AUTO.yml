# 定时自动编译：Auto-Clean 清理完成后同时构建 AP3000M 的两种 MT 配置
# （原 AP3000M-AUTO，重命名并改为 MT5700 / MT5700M 双矩阵并行）
#   MT5700  —— 仅 luci-app-mt5700
#   MT5700M —— luci-app-mt5700m + sms-tool_q + ubus-at-daemon
# 产物文件名与 Release Tag 均嵌入 MT 模式，可并存区分。
name: AP3000M-MT-AUTO

on:
  # Auto-Clean 完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}-${{ matrix.MT_MODE }}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [AP3000M]
        # 本机型源码取自 VIKINGYFY/immortalwrt 的 owrt 分支（该仓库无 master 分支）
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]
        # 同时编译两种 MT 配置（严格互斥，由 Apply/VerifyMTMode 保证）
        MT_MODE: [MT5700, MT5700M]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: 'false'
      MT_MODE: ${{ matrix.MT_MODE }}
