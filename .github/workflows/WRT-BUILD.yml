# 手动编译入口（机型 × MT 模式 二选一；产物/Tag 嵌入 MT 模式）
name: 手动编译固件

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-WIFI-YES'
        required: true
        type: choice
        options:
          # 母配置（既有，未做任何改动）
          - H5000M-WIFI-YES
          - AP3000M
          - X86
          # FM350 变体：母配置 + luci-app-fm350
          - H5000M-WIFI-YES-FM350
          - AP3000M-FM350
          - X86-FM350
          # NetWiz 家族（仅组合变体）：母配置 + luci-app-netwiz + 可选 MT / FM350 组合
          # 注意：选 -NETWIZ-MT5700 / -NETWIZ-MT5700M 时，下方 MT Mode 必须同步
          # 选为 MT5700 / MT5700M，否则校验步骤会拦截（防止产出名不副实的固件）
          - H5000M-WIFI-YES-NETWIZ-MT5700
          - AP3000M-NETWIZ-MT5700
          - X86-NETWIZ-MT5700
          - H5000M-WIFI-YES-NETWIZ-MT5700M
          - AP3000M-NETWIZ-MT5700M
          - X86-NETWIZ-MT5700M
          - H5000M-WIFI-YES-NETWIZ-FM350
          - AP3000M-NETWIZ-FM350
          - X86-NETWIZ-FM350
          # H5000M 自用：母配置 + luci-app-netmonitor + luci-app-taygedo
          # 注意：选此项时，下方 MT Mode 必须同步选为 MT5700（本配置固定
          # MT5700 方案，MT 层由 ApplyMTMode 叠加），否则校验步骤会拦截
          - H5000M-WIFI-YES-NETMONITOR
      SOURCE:
        description: '源码仓库'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
          - LiBwrt/openwrt-6.x
      BRANCH:
        description: '源码分支'
        default: 'master'
        required: true
        type: string
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      MT_MODE:
        description: 'MT 插件模式（二选一，留空则不安装任何 MT 插件）'
        default: 'MT5700M'
        required: true
        type: choice
        options:
          - MT5700M
          - MT5700
          - NONE
      TEST:
        description: '仅生成配置文件，不编译固件。'
        default: 'true'
        required: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: ${{inputs.CONFIG}}（MT 模式：${{inputs.MT_MODE}}）
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{inputs.CONFIG}}
      WRT_THEME: aurora
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      WRT_BRANCH: ${{inputs.BRANCH}}
      WRT_SOURCE: ${{inputs.SOURCE}}
      # Arm 机型（H5000M / AP3000M）用 GitHub 原生 Arm64 runner，X86 保持 x86_64
      WRT_RUNNER: ${{ (contains(inputs.CONFIG, 'H5000M') || contains(inputs.CONFIG, 'AP3000M')) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
      # NONE / 其他 → 空字符串（不安装任何 MT 插件）
      # 注意：GHA 表达式中空字符串为 falsy，不能写成 `cond && '' || x`，
      # 必须用显式三元链保证 NONE 时最终得到空值。
      MT_MODE: ${{ inputs.MT_MODE == 'MT5700' && 'MT5700' || (inputs.MT_MODE == 'MT5700M' && 'MT5700M' || '') }}
      # 归组标签（WRT_VARIANT）：按「产品/配置本身」判定，不按插件内容。
      #   - NETMONITOR（H5000M 自用）优先判定 → 归「自用」，独立分类，
      #     不进入公开 MT5700；
      #   - NETWIZ 家族（含 -MT5700 / -MT5700M / -FM350 组合）→ 统一归「NetWiz」，
      #     即使组合变体内部使用 MT / FM350 插件，也只属于 NetWiz 产品分类，
      #     绝不进入 MT5700 / MT5700M / FM350；
      #   - 其余 FM350 变体 → 归「FM350」；
      #   - 其余（无变体）→ 由 WRT-CORE 按 MT_MODE 归组（MT5700 / MT5700M / BASE）。
      # 写法要点：GHA 表达式中空字符串为 falsy，不能写成 `cond && '' || x`
      # （空值会被 `||` 吞掉继续取右值），必须用显式嵌套三元链。
      # 配置名（Config/*.txt / 下拉项）用全大写 NETWIZ，与既有 FM350 风格一致。
      WRT_VARIANT: ${{ contains(inputs.CONFIG, 'NETMONITOR') && '自用' || (contains(inputs.CONFIG, 'NETWIZ') && 'NetWiz' || (contains(inputs.CONFIG, 'FM350') && 'FM350' || '')) }}
