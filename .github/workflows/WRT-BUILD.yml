# 手动编译入口（机型 × MT 模式 二选一；产物/Tag 嵌入 MT 模式）
name: 手动编译固件

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-WIFI-YES'
        required: true
        type: choice
        options:
          # 母配置（既有，未做任何改动）
          - H5000M-WIFI-YES
          - AP3000M
          - X86
          # FM350 变体：母配置 + luci-app-fm350
          - H5000M-WIFI-YES-FM350
          - AP3000M-FM350
          - X86-FM350
          # NetWiz 家族：母配置 + luci-app-netwiz（及可选 MT / FM350 组合）
          # 注意：选 -NETWIZ-MT5700 / -NETWIZ-MT5700M 时，下方 MT Mode 必须同步
          # 选为 MT5700 / MT5700M，否则校验步骤会拦截（防止产出名不副实的固件）
          - H5000M-WIFI-YES-NETWIZ
          - AP3000M-NETWIZ
          - X86-NETWIZ
          - H5000M-WIFI-YES-NETWIZ-MT5700
          - AP3000M-NETWIZ-MT5700
          - X86-NETWIZ-MT5700
          - H5000M-WIFI-YES-NETWIZ-MT5700M
          - AP3000M-NETWIZ-MT5700M
          - X86-NETWIZ-MT5700M
          - H5000M-WIFI-YES-NETWIZ-FM350
          - AP3000M-NETWIZ-FM350
          - X86-NETWIZ-FM350
      SOURCE:
        description: '源码仓库'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
          - LiBwrt/openwrt-6.x
      BRANCH:
        description: '源码分支'
        default: 'master'
        required: true
        type: string
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      MT_MODE:
        description: 'MT 插件模式（二选一，留空则不安装任何 MT 插件）'
        default: 'MT5700M'
        required: true
        type: choice
        options:
          - MT5700M
          - MT5700
          - NONE
      TEST:
        description: '仅生成配置文件，不编译固件。'
        default: 'true'
        required: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: ${{inputs.CONFIG}}（MT 模式：${{inputs.MT_MODE}}）
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{inputs.CONFIG}}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      WRT_BRANCH: ${{inputs.BRANCH}}
      WRT_SOURCE: ${{inputs.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
      # NONE / 其他 → 空字符串（不安装任何 MT 插件）
      # 注意：GHA 表达式中空字符串为 falsy，不能写成 `cond && '' || x`，
      # 必须用显式三元链保证 NONE 时最终得到空值。
      MT_MODE: ${{ inputs.MT_MODE == 'MT5700' && 'MT5700' || (inputs.MT_MODE == 'MT5700M' && 'MT5700M' || '') }}
      # 变体标签：配置名后缀用于产物文件名区分（固件名本身不含机型名，
      # 不加这个后缀，下载到本地后分不出是普通版还是各变体版）。
      #
      # 写法要点：GHA 表达式中空字符串为 falsy，不能写成 `cond && '' || x`
      # （空值会被 `||` 吞掉继续取右值），必须用显式嵌套三元链；
      # NetWiz 家族含组合变体（NETWIZ-MT5700 / -MT5700M / -FM350），
      # 判定 NETWIZ 必须用 contains 而非 endsWith。
      # 配置名后缀与产物标签刻意不同大小写：
      #   - 配置名（Config/*.txt / 下拉项）用全大写 NETWIZ，与既有 FM350 风格一致；
      #   - 产物标签用驼峰 NetWiz，因为它直接出现在下载到的固件文件名里，给人看。
      # 组合变体归组独立：NetWiz-MT5700 / NetWiz-MT5700M / NetWiz-FM350 各自成组。
      WRT_VARIANT: ${{ contains(inputs.CONFIG, 'NETWIZ') && (contains(inputs.CONFIG, 'FM350') && 'NetWiz-FM350' || (endsWith(inputs.CONFIG, 'MT5700M') && 'NetWiz-MT5700M' || (endsWith(inputs.CONFIG, 'MT5700') && 'NetWiz-MT5700' || 'NetWiz'))) || (contains(inputs.CONFIG, 'FM350') && 'FM350' || '') }}
