# 手动编译入口（机型 × MT 模式 二选一；产物/Tag 嵌入 MT 模式）
name: 手动编译固件

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'H5000M-WIFI-YES'
        required: true
        type: choice
        options:
          - H5000M-WIFI-YES
          - H5000M-WIFI-YES-FM350
          - AP3000M
          - AP3000M-FM350
          - X86
          - X86-FM350
      SOURCE:
        description: '源码仓库'
        default: 'immortalwrt/immortalwrt'
        required: true
        type: choice
        options:
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
          - LiBwrt/openwrt-6.x
      BRANCH:
        description: '源码分支'
        default: 'master'
        required: true
        type: string
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      MT_MODE:
        description: 'MT 插件模式（二选一，留空则不安装任何 MT 插件）'
        default: 'MT5700M'
        required: true
        type: choice
        options:
          - MT5700M
          - MT5700
          - NONE
      TEST:
        description: '仅生成配置文件，不编译固件。'
        default: 'true'
        required: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: ${{inputs.CONFIG}}（MT 模式：${{inputs.MT_MODE}}）
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{inputs.CONFIG}}
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      WRT_BRANCH: ${{inputs.BRANCH}}
      WRT_SOURCE: ${{inputs.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
      # NONE / 其他 → 空字符串（不安装任何 MT 插件）
      # 注意：GHA 表达式中空字符串为 falsy，不能写成 `cond && '' || x`，
      # 必须用显式三元链保证 NONE 时最终得到空值。
      MT_MODE: ${{ inputs.MT_MODE == 'MT5700' && 'MT5700' || (inputs.MT_MODE == 'MT5700M' && 'MT5700M' || '') }}
      # 变体标签：FM350 配置用于产物文件名区分（固件名本身不含机型名，
      # 不加这个后缀，下载到本地后分不出是普通版还是 FM350 版）
      WRT_VARIANT: ${{ endsWith(inputs.CONFIG, 'FM350') && 'FM350' || '' }}
