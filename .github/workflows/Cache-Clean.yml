name: Cache-Clean

on:
  # 自动清理：每周日 UTC 20:00（北京时间周一 04:00）
  schedule:
    - cron: 0 20 * * 0
  # 手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Clean
        run: gh cache delete --all
