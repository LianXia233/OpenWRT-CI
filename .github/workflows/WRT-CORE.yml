# 云编译公用核心（被 WRT-BUILD / H5000M-MT-AUTO / AP3000M-MT-AUTO / X86-MT-AUTO 调用）
name: 固件编译核心（公共）

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      # 以下局域网 / 无线默认值统一由 Config/Defaults.txt 提供（优先级：
      # 本输入显式传入 > 配置文件默认）。留空（default: ""）即使用配置文件值，
      # 各调用方无需再重复传参；需要单独覆盖时传对应值即可。
      WRT_NAME:
        required: false
        type: string
        default: ""
      WRT_SSID:
        required: false
        type: string
        default: ""
      WRT_WORD:
        required: false
        type: string
        default: ""
      WRT_IP:
        required: false
        type: string
        default: ""
      WRT_PW:
        required: false
        type: string
        default: ""
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      # MT 插件模式（独立配置层，全机型复用）：
      #   ""      —— 不安装任何 MT 插件（默认，保持普通 CI 行为）
      #   MT5700  —— 仅 luci-app-mt5700（方案 B）
      #   MT5700M —— luci-app-mt5700m + sms-tool_q + ubus-at-daemon（方案 A）
      #   [禁用] MT5700M 自 2026-10-07 起暂时禁用（不稳定），守卫步骤会直接拦截。
      # 其他值在 ApplyMTMode / VerifyMTMode / Packages.sh 中报错并终止。
      MT_MODE:
        required: false
        type: string
        default: ""
      # 变体标签（可选，默认空）：用于在同一机型的不同配置变体之间区分产物文件名。
      # 例如 AP3000M-FM350 传 "FM350"，固件名末尾追加 "-FM350"。
      # 留空时产物命名与历史完全一致（H5000M / AP3000M / X86 不受影响）。
      WRT_VARIANT:
        required: false
        type: string
        default: ""

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  MT_MODE: ${{inputs.MT_MODE}}
  WRT_VARIANT: ${{inputs.WRT_VARIANT}}

jobs:
  core:
    name: 编译核心 · ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    # 略低于平台 6h 硬上限：被硬上限杀掉时 runner 直接终止，
    # 缓存的 post 保存步骤会被整段跳过，下次必然冷编译。
    timeout-minutes: 345
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # v7 起默认拒绝在 pull_request_target / workflow_run 下检出 fork PR 代码。
          # 本仓库是 fork，且定时编译靠 workflow_run 串联（自动清理 → 编译），
          # 上游清理若跑在 fork PR 分支上，下游检出会被拒导致构建失败；
          # 此处显式授权以保留原有行为（本流水线只信任本仓库自身的工作流）。
          allow-unsafe-pr-checkout: true

      - name: 检查 MT5700M 是否已暂时禁用
        if: env.MT_MODE == 'MT5700M'
        run: |
          echo "::error::MT5700M 变体已暂时禁用（2026-10-07 起，原因：不稳定）。如需恢复，请移除本守卫步骤并恢复各入口的 MT5700M 配置项。"
          exit 1

      - name: 选择 apt 镜像
        # 托管 runner 的 azure.archive.ubuntu.com 会间歇性退化到几十 kB/s，而且不报错：
        # 内置 /etc/apt/apt-mirrors.txt 只在「镜像出错」时降级，慢而不失败永远不触发它。
        # 2026-11-06 的初始化失败全是这一形态 —— 上游脚本要下 661 MB 依赖，实测 50 kB/s
        # 时单个 8.5 MB 的 texlive-binaries 就走掉 3 分钟，任何时间预算都兜不住。
        timeout-minutes: 5
        run: |
          # 测速必须带真实体积：上一版探的是 1.76 MB 的 main/Packages.gz，小文件测的是
          # 连接建立而不是持续吞吐。run 124 的实测输出是 azure=45627172 / archive=1045578
          # —— 探测把慢镜像判成快 44 倍，而几分钟后同一个 azure 下 bulk .deb 只有约
          # 50 kB/s。小文件探测不只是测不出退化，它会主动把慢镜像选进来。
          # 这里改用 universe 的 Packages.xz（15.0 MB，apt 自己就要下载）并用 Range
          # 只取前 8 MB：50 kB/s 时 8 MB 要 160 秒，必然超过 --max-time 而现形。
          probe() {
            local sp
            sp=$(curl -sSL -r 0-8388607 -o /dev/null --connect-timeout 10 --max-time 25 \
              -w '%{speed_download}' "$1" 2>/dev/null || true)
            echo "${sp:-0}" | cut -d. -f1
          }
          # 代号取自 runner 镜像，避免 runner 升级后探测目标 404（404 会让两边都测到 0，
          # 判定退回「保持默认」，属安全降级而不是误切换）
          . /etc/os-release 2>/dev/null || true
          IDX="dists/${VERSION_CODENAME:-noble}/universe/binary-amd64/Packages.xz"
          AZ=$(probe "http://azure.archive.ubuntu.com/ubuntu/${IDX}")
          ALT=$(probe "https://archive.ubuntu.com/ubuntu/${IDX}")
          AZ=${AZ:-0}
          ALT=${ALT:-0}
          echo "apt 批量吞吐实测（字节/秒）：azure=${AZ} archive=${ALT}"

          # 只在 azure 确实慢、且官方 archive 明显更快时切换；两边都快或都快不动时
          # 保持原配置，避免把正常环境改坏。
          if [ "$AZ" -lt 300000 ] && [ "$ALT" -ge $((AZ * 2)) ] && [ "$ALT" -ge 300000 ]; then
            echo "azure 吞吐低于 300 kB/s 且 archive 明显更快，改为 archive.ubuntu.com 优先"
            printf '%s\t%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 'priority:1' \
              'https://security.ubuntu.com/ubuntu/' 'priority:2' \
              'http://azure.archive.ubuntu.com/ubuntu/' 'priority:3' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            # mirrorlist 只覆盖走 apt-mirrors.txt 的条目；硬编码 azure 的 sources 一并替换，
            # 否则未接 mirrorlist 的源仍会打到慢镜像。
            sudo sed -i \
              's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            echo "APT_MIRROR=archive" >> "$GITHUB_ENV"
          else
            echo "保持 runner 默认镜像配置"
            # 记录当前主镜像，供「初始化编译环境」失败重试时切到另一个源。
            echo "APT_MIRROR=azure" >> "$GITHUB_ENV"
          fi

      - name: 初始化编译环境
        # 上游依赖约 661 MB，正常 3~5 分钟。2026-11-07 的失败形式是：镜像探测
        # 时吞吐正常，随后 bulk 下载断连，job 拖到 60~106 分钟后被 runner 判定
        # 通信超时，日志整段丢失（连失败点都看不到）。这里给 step 一个硬上限，
        # 宁可早失败保留日志，也不让它无界挂死。
        timeout-minutes: 60
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 托管 runner 的 apt 镜像（azure.archive.ubuntu.com）偶发单包卡死：
          # 2026-11-06 定时编译的 job 大量停在依赖下载阶段（实测单个包等待 549 s，
          # 整步 40 分钟以上，而正常仅 3.5 分钟），最终被 runner 通信超时终止、
          # 连日志都没留下。卡住的连接 30 s 后放弃并重试，不再无限等待。
          #
          # 必须写进 apt.conf.d 而不是只加在命令行 -o 参数上：上游
          # init_build_environment.sh 自己调 apt，读不到本步骤的参数，那 661 MB
          # 的依赖下载才是真正会卡死的地方。
          sudo tee /etc/apt/apt.conf.d/99-ci-transfer-guard >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::http::Connection-Timeout "15";
          Acquire::Retries "5";
          Acquire::http::Pipeline-Depth "0";
          DPkg::Lock::Timeout "120";
          EOF

          # 失败重试时换一条链路：探测只反映步骤开始那一瞬的吞吐，
          # 2026-11-07 的故障正是「探测正常、随后 bulk 下载断连」，
          # 只在开始时择优一次覆盖不了这种退化。
          switch_apt_mirror() {
            local target
            if [ "${APT_MIRROR:-azure}" = "archive" ]; then
              target="azure"
            else
              target="archive"
            fi
            echo "切换 apt 主镜像：${APT_MIRROR:-azure} → ${target}" >&2
            if [ "$target" = "archive" ]; then
              printf '%s\t%s\n' \
                'https://archive.ubuntu.com/ubuntu/' 'priority:1' \
                'https://security.ubuntu.com/ubuntu/' 'priority:2' \
                'http://azure.archive.ubuntu.com/ubuntu/' 'priority:3' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i \
                's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            else
              printf '%s\t%s\n' \
                'http://azure.archive.ubuntu.com/ubuntu/' 'priority:1' \
                'https://archive.ubuntu.com/ubuntu/' 'priority:2' \
                'https://security.ubuntu.com/ubuntu/' 'priority:3' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i \
                's|https://archive\.ubuntu\.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            echo "APT_MIRROR=${target}" >> "$GITHUB_ENV"
          }

          # `timeout` 只给直接子进程（bash）发信号，脚本里的 apt/dpkg 会成为
          # 孤儿继续持锁并占用日志管道 —— 2026-11-07 的 60~106 分钟挂死正是
          # 这种形态。重试前必须按名字清掉，否则第二次会卡在 dpkg 锁上。
          kill_stalled_init() {
            sudo pkill -9 -f '/tmp/init_build_environment.sh' 2>/dev/null || true
            sudo pkill -9 -x apt 2>/dev/null || true
            sudo pkill -9 -x apt-get 2>/dev/null || true
            sudo pkill -9 -x dpkg 2>/dev/null || true
          }

          sudo -E apt -yqq purge firefox
          # 移除 runner 预置的 google-chrome apt 源：其镜像偶发哈希不一致
          # （File has unexpected size / Mirror sync in progress?），会导致
          # `apt update` 返回非零并中断整个初始化步骤。
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo -E apt -yqq update || sudo -E apt -yqq update
          # 不做 full-upgrade / autoremove：托管 runner 每次全量升级要数分钟，
          # 对 OpenWrt 编译零收益，属于纯耗时项
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev ccache
          # 上游脚本先落盘再执行（原来用 `bash <(curl -sL ...)`，curl 无超时、
          # 下载失败时组装的空脚本也会“成功”退出）。--fail 让 4xx/5xx 立即失败，
          # --max-time 防挂死。
          curl -fsSL --connect-timeout 15 --max-time 180 \
            -o /tmp/init_build_environment.sh \
            https://build-scripts.immortalwrt.org/init_build_environment.sh
          # 上游脚本第一步是 `apt full-upgrade -y`：每天全量升级宿主，下载量大、
          # 版本还随镜像漂移，而托管 runner 镜像本身已是近期更新，apt install
          # 也会按需升级依赖，这一步对编译零收益却放大失败面。命中则注释掉，
          # 未命中（上游改写法）则保留原行为并告警，不硬失败。
          if grep -qE '^[[:space:]]*apt full-upgrade -y' /tmp/init_build_environment.sh; then
            sed -i -E \
              's|^([[:space:]]*)apt full-upgrade -y|\1# [CI] 跳过 full-upgrade（见 WRT-CORE.yml）: apt full-upgrade -y|' \
              /tmp/init_build_environment.sh
            echo "已在初始化脚本中禁用 apt full-upgrade"
          else
            echo "::warning::未在 init_build_environment.sh 中定位到 apt full-upgrade，保留上游行为"
          fi
          # 依赖安装正常 3~5 分钟。单次上限 25 分钟即视为镜像/网络异常：
          # 661 MB 在 450 kB/s 以上都能下完，更慢的链路即使跑完也会拖垮总时长，
          # 第二次换镜像更划算。apt 已下好的 .deb 留在 /var/cache/apt/archives，
          # 第二次从缺的包继续下，是断点续传而不是从头再来。
          INIT_OK=0
          for i in 1 2; do
            if sudo timeout --kill-after=30 1500 bash /tmp/init_build_environment.sh; then
              INIT_OK=1
              break
            fi
            echo "init_build_environment 第 ${i} 次失败或超时" >&2
            kill_stalled_init
            pgrep -a apt || true
            if [ "$i" = "1" ]; then
              switch_apt_mirror
            fi
            sleep 10
          done
          if [ "$INIT_OK" != "1" ]; then
            echo "::error::init_build_environment 连续失败，终止以避免后续编译无谓耗时"
            exit 1
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: 初始化构建变量
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV
          # luci-app-taygedo 导入开关：完全由配置文件自己声明驱动。
          # 早期这个包只服务 H5000M 自用变体，取包逻辑写死在
          # Packages-NetMonitor.sh 里、由 contains(WRT_CONFIG,'NETMONITOR')
          # 触发，其他机型想用就必须再改一遍 YAML。现在改为：任何
          # Config/*.txt 只要写了 CONFIG_PACKAGE_luci-app-taygedo=y 就自动
          # 导入，默认所有既有配置都不含该行，故对现网产物零影响。
          if grep -qE '^[[:space:]]*CONFIG_PACKAGE_luci-app-taygedo=y[[:space:]]*$' \
              "./Config/$WRT_CONFIG.txt" 2>/dev/null; then
            echo "WRT_TAYGEDO=true" >> $GITHUB_ENV
          else
            echo "WRT_TAYGEDO=false" >> $GITHUB_ENV
          fi
          # MT 模式标签：用于产物文件名 / Release Tag / 配置导出，区分双配置并行编译
          if [ -z "${MT_MODE:-}" ]; then
            echo "WRT_MT=NONE" >> $GITHUB_ENV
          else
            echo "WRT_MT=$MT_MODE" >> $GITHUB_ENV
          fi
          # 设备名：配置名首个 '-' 前的段（H5000M / AP3000M / X86），
          # 用作固件文件名首段 —— 同一 Release 汇聚多设备时仍可一眼识别。
          echo "WRT_DEVICE=${WRT_CONFIG%%-*}" >> $GITHUB_ENV
          # 编译日期（YY.MM.DD，TZ=UTC-8 即北京时间）：同时用于固件文件名的
          # 日期段与 Release Tag 的日期段，二者严格同源。
          # luci-app-online-upgrade 的 version::pick() 会从资产名取「最后一个
          # 点分数字」当版本号，只有 YY.MM.DD / YYYY.MM.DD 才会被 is_date_tag()
          # 认作日期型版本，进而与本机 SNAPSHOT 固件的构建日期正确比较新/旧；
          # 写成 20261109（无点）或完全不带日期都识别不到，只能退化成按
          # Release 发布时间判断，甚至误判降级。
          WRT_DATE_SHORT=$(TZ=UTC-8 date +"%y.%m.%d")
          echo "WRT_DATE_SHORT=$WRT_DATE_SHORT" >> $GITHUB_ENV
          # 模组/插件段（固件文件名第二段）：严格按「产品/配置本身」推导，
          # 全部使用 ASCII —— GitHub 资产名会把中文等非 ASCII 字节化
          # （实测「自用」变成 `.`，产出 H5000M-.-sysupgrade.bin），既不可读
          # 也无法被在线升级插件稳定匹配。Release 标题与 Tag 仍保持中文。
          # 判断优先级：
          #   NETMONITOR（自用）→ SelfUse（独立分类，不进入公开 MT5700）
          #   NETWIZ 家族 → NetWiz-<组合>（NetWiz 是独立产品，即使内部含
          #     MT / FM350 插件也只属于 NetWiz，不进入 MT5700 / MT5700M / FM350）
          #   FM350 变体（非 NetWiz）→ FM350
          #   其余普通配置 → 按 MT_MODE（MT5700 / MT5700M），无 MT 则 BASE
          # BASE 是占位段，保证所有变体的文件名都是统一的四段结构。
          case "$WRT_CONFIG" in
            *-NETMONITOR*)
              WRT_FLAVOR="SelfUse"
              ;;
            *-NETWIZ*)
              case "$WRT_CONFIG" in
                *-MT5700M) WRT_FLAVOR="NetWiz-MT5700M" ;;
                *-MT5700)  WRT_FLAVOR="NetWiz-MT5700" ;;
                *-FM350)   WRT_FLAVOR="NetWiz-FM350" ;;
                *)         WRT_FLAVOR="NetWiz" ;;
              esac
              ;;
            *-FM350*)
              WRT_FLAVOR="FM350"
              ;;
            *)
              case "${MT_MODE:-}" in
                MT5700)  WRT_FLAVOR="MT5700" ;;
                MT5700M) WRT_FLAVOR="MT5700M" ;;
                *)       WRT_FLAVOR="BASE" ;;
              esac
              ;;
          esac
          echo "WRT_FLAVOR=$WRT_FLAVOR" >> $GITHUB_ENV
          # Release 归组（Tag = <组名>-<YY.MM.DD>）：让 Releases 页面按分类归类，
          # 同组同一天的全部机型产物汇聚到同一个 Release 里：
          #   WRT_VARIANT 非空 → 按产品/变体组（NetWiz 家族统一归 NetWiz，
          #     FM350 / 自用 各自独立成组，NetWiz 绝不与其插件分类交叉）
          #   无变体但选了 MT 模式 → 按 MT5700 / MT5700M 成组
          #   其余（无变体且未选 MT 模式）→ BASE 组
          # Tag 日期只到天（TZ=UTC-8）：三个机型的定时 job 由同一次 Auto-Clean
          # 触发、在同一天内执行，天级时间戳必然一致，因此跨 workflow 也能
          # 共享同一 Tag —— softprops/action-gh-release 对已存在的 Tag 会把
          # 产物追加进既有 Release，而不是另开一个。
          if [ -n "${WRT_VARIANT:-}" ]; then
            WRT_TAG_GROUP="$WRT_VARIANT"
          elif [ -n "${MT_MODE:-}" ]; then
            WRT_TAG_GROUP="$MT_MODE"
          else
            WRT_TAG_GROUP="BASE"
          fi
          echo "WRT_TAG_GROUP=$WRT_TAG_GROUP" >> $GITHUB_ENV
          # Tag 与固件文件名共用同一份日期变量，不再各自取一次 date，
          # 避免跨零点时「Tag 是今天、文件名是昨天」的错位。
          echo "WRT_RELEASE_TAG=${WRT_TAG_GROUP}-${WRT_DATE_SHORT}" >> $GITHUB_ENV
          echo "当前机型=${WRT_CONFIG} MT_MODE=${MT_MODE:-NONE} 变体=${WRT_VARIANT:-（无）} 归组=${WRT_TAG_GROUP} 编译日期=${WRT_DATE_SHORT} Tag=${WRT_TAG_GROUP}-${WRT_DATE_SHORT}"

      - name: 拉取 OpenWrt 源码
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: 脚本格式规整（CRLF → LF）
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # 关键改动 1：工具链 + ccache 合成一份缓存
      #   - 只缓存 staging_dir/host* 与 staging_dir/tool*：
      #     staging_dir/target-* 是按机型区分的编译产物，随配置漂移，
      #     打包上传它纯属浪费带宽并污染缓存。
      #   - 重要：原始 `make defconfig && make clean` 会连同整个 staging_dir
      #     （含 host*/tool*）一并删除（_clean: rm -rf $(BUILD_DIR)
      #     $(STAGING_DIR) $(BIN_DIR)），恢复进来的工具链会在编译前被清空、
      #     每次构建都从零编译工具链，缓存形同虚设。故「生成配置并执行
      #     defconfig」步骤已把 make clean 替换为只清 build_dir 与 bin 的
      #     定向删除，本缓存才能真正生效。
      #   - key 绑定 WRT_TARGET 而非 WRT_CONFIG：H5000M 与 AP3000M 同为
      #     mediatek/filogic，可共用同一份工具链，避免每天白编译一次。
      #   - key 不再把 commit hash 放在唯一位置上，配合 restore-keys 做前缀回退，
      #     上游一有新提交也能命中上次的工具链。
      #   - 保存不再依赖 save-always（官方已标记弃用且行为不符合预期），改为下方
      #     独立的 actions/cache/save@v6 步骤，并带 always()：失败/超时取消时
      #     同样写入，避免陷入「超时 → 无缓存 → 再超时」的死循环。
      - name: 恢复缓存（工具链 & ccache）
        id: cache-tc-restore
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v6
        with:
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      # 关键改动 2：dl 缓存按「源码 + 分支」共享
      #   下载的源码包与机型无关。原 key 带 WRT_CONFIG，H5000M / AP3000M / X86
      #   各存一份 2.1GB，三份就是 6.3GB，直接把 10GB 配额撑爆触发 LRU 淘汰，
      #   结果是所有缓存一起失效。共享后每个源码分支只存一份。
      - name: 恢复缓存（下载源码包）
        id: cache-dl-restore
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v6
        with:
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          restore-keys: |
            wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-
          path: |
            ./wrt/dl

      - name: 修正缓存时间戳
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            # 归一化时间戳 + tmp/.build 标记：让 OpenWrt 跳过工具链重建检查。
            # 源码（build_dir）本来就不在缓存里，包级增量由 ccache 与 make stamp 决定。
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          # 不再在 cache miss 时删除历史缓存：
          # 上面的 restore-keys 正是依赖历史缓存做前缀回退，删掉等于每次都冷启动。
          # 配额交给 GitHub LRU 自动回收，必要时用 Cache-Clean 手动清理。

      # feeds 缓存已移除：实测 `feeds update -a` 仅约 1 分钟，
      # 而缓存键绑定 commit hash 几乎必然 miss，多出的两次上传/下载是净亏损。

      - name: 更新 feeds 软件源
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入自定义插件
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      # FM350 变体专属：拉取 luci-app-fm350 源码 + 准备 Rust 交叉编译目标。
      # 条件为 contains FM350，H5000M / AP3000M / X86 三套既有构建不执行本步骤。
      #
      # 位置必须在 Custom Settings（cat 配置 + make defconfig）与 Download Packages
      # 之前：make defconfig 只认 package/ 树里此刻已经存在的 Makefile，包还没就位时
      # 配置里的 CONFIG_PACKAGE_luci-app-fm350=y 只是一条孤立符号，会被 defconfig
      # 连同其依赖解析一起丢弃；之后再 clone 也已错过选包时机，表现为
      # 「三个 job 全绿，固件里却没有 luci-app-fm350」。
      # 早于 Download Packages 则让包参与 make download 预取，避免编译期再联网。
      - name: 导入 luci-app-fm350（FM350 变体）
        if: contains(env.WRT_CONFIG, 'FM350')
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-FM350.sh

          # fm350d 的交叉编译由下方「预编译全部 Rust 后端」步骤统一处理
          # （官方 Rust SDK + CI 缓存产物）；本步骤只负责把包放进 package/，
          # 让 defconfig 能选中、make download 能预取依赖。

      # H5000M 变体专属：luci-app-h5000m-fancontrol 的控制器是 Rust 写的。
      # 其交叉编译同样由下方「预编译全部 Rust 后端」步骤统一处理
      # （官方 Rust SDK），不再单独准备 rustup target。

      # NetWiz 变体专属：拉取 luci-app-netwiz 源码放进 package/。
      # 条件为 contains NETWIZ，H5000M / AP3000M / X86 及各自 FM350 变体
      # 均不执行本步骤，既有构建路径零影响。
      #
      # 位置与上面的 fm350 步骤同理，必须在「生成配置并执行 defconfig」之前：
      # make defconfig 只认 package/ 树里此刻已存在的 Makefile，包未就位时
      # CONFIG_PACKAGE_luci-app-netwiz=y 是孤立符号，会被连依赖一起丢弃，
      # 结果是「编译全绿、固件里没有这个插件」。
      #
      # 本包额外依赖 LuCI feed 的编译框架（上游 Makefile 走
      # include $(TOPDIR)/feeds/luci/luci.mk），故还必须晚于
      # 「更新 feeds 软件源」步骤 —— 当前位置已满足。
      - name: 导入 luci-app-netwiz（NetWiz 变体）
        if: contains(env.WRT_CONFIG, 'NETWIZ')
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-NetWiz.sh

          # luci.mk 可用性预检：上游 Makefile 用它触发出包与 i18n 拆分，
          # 缺失只会在编译中期报难懂的 make 错误，这里提前显式失败。
          LUCI_MK="$(pwd)/../feeds/luci/luci.mk"
          if [ ! -f "$LUCI_MK" ]; then
            echo "::error::未找到 $LUCI_MK：feeds 未更新或 luci feed 未展开"
            exit 1
          fi
          echo "luci.mk 就位：$LUCI_MK"

      # H5000M 自用变体专属：拉取 luci-app-netmonitor（网络监控）源码放进
      # package/。条件为 contains NETMONITOR，H5000M / AP3000M / X86 及各自
      # FM350 / NetWiz 变体均不执行本步骤，既有构建路径零影响。
      #
      # 位置与上面的 fm350 / netwiz 步骤同理，必须在「生成配置并执行
      # defconfig」之前：make defconfig 只认 package/ 树里此刻已存在的
      # Makefile，包未就位时 CONFIG_PACKAGE_luci-app-netmonitor=y 是孤立
      # 符号，会被连依赖一起丢弃，结果是「编译全绿、固件里没有这个插件」。
      #
      # luci-app-netmonitor 的 Makefile include feeds/luci/luci.mk（走 LuCI
      # feed 编译框架），故还必须晚于「更新 feeds 软件源」步骤。
      #
      # 注：luci-app-taygedo 已从这里剥离，改由下方独立的配置驱动步骤导入。
      - name: 导入 luci-app-netmonitor（H5000M 自用变体）
        if: contains(env.WRT_CONFIG, 'NETMONITOR')
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-NetMonitor.sh

          # luci.mk 可用性预检：luci-app-netmonitor 的 Makefile 用它触发
          # 出包与 i18n 拆分，缺失只会在编译中期报难懂的 make 错误，这里
          # 提前显式失败。
          LUCI_MK="$(pwd)/../feeds/luci/luci.mk"
          if [ ! -f "$LUCI_MK" ]; then
            echo "::error::未找到 $LUCI_MK：feeds 未更新或 luci feed 未展开"
            exit 1
          fi
          echo "luci.mk 就位：$LUCI_MK"

      # luci-app-taygedo（塔吉多签到）：配置驱动导入，与机型名解耦。
      #
      # 触发条件只有一个 —— Config/$WRT_CONFIG.txt 里写了
      # CONFIG_PACKAGE_luci-app-taygedo=y（上一步「初始化构建变量」已把结果
      # 落到 env.WRT_TAYGEDO）。因此给 X86 / AP3000M / MT5700 等任何机型加
      # 这个插件都只需要动配置文件一行，不必改本工作流。
      #
      # 取包脚本 Scripts/Packages-Taygedo.sh 负责三件事：
      #   1. 从 monorepo 提取 openwrt/luci-app-taygedo 到 package/ 一级；
      #   2. 按包内 TAYGEDO_ARCHIVE 模板解析真实资产名，并在 Release 里
      #      做可达性探测 / 版本对齐（上游双形态拆分后必须取 *-openwrt.tar.gz，
      #      取无后缀的通用版会把已移除的 WebUI 带回路由器）；
      #   3. 预下载归档到 dl/ 并校验内容，把「深层编译期 404 / 坏归档」
      #      提前到取包阶段。
      #
      # 同样必须早于 defconfig：包未就位时该符号会被 defconfig 悄悄丢弃。
      - name: 导入 luci-app-taygedo（配置驱动，可选）
        if: env.WRT_TAYGEDO == 'true'
        env:
          # 可选：对 taygedo-CI 有只读权限的 PAT。缺省时脚本走匿名访问
          # （公开仓库 Releases 匿名可读），仅在 GitHub 匿名限流时才有必要配。
          # 注意不能复用 env.GITHUB_TOKEN —— 它只对当前仓库有效，拿去调
          # taygedo-CI 的 API 会 404。
          TAYGEDO_TOKEN: ${{ secrets.TAYGEDO_TOKEN }}
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-Taygedo.sh

      # luci-app-online-upgrade（在线升级）：全机型无条件导入，不按机型名分支。
      #
      # 上游仓库是「包即仓库根」形态（Makefile / root/ / rust/ 都在根目录），
      # 不是 feeds 布局，因此不能挂 src-git feed，只能 clone 进 package/。
      # 加机型 = 不需要动这里，Settings.sh 已对全部配置统一打开
      # CONFIG_PACKAGE_luci-app-online-upgrade=y。
      #
      # 必须早于 defconfig：包未就位时该符号是孤立符号，会被 defconfig 连依赖
      # 一起丢弃，结果是「编译全绿、固件里没有这个插件」。也必须在
      # 「更新 feeds 软件源」之后 —— 上游 Makefile 走 feeds/luci/luci.mk。
      #
      # 包内 Rust 后端不在这里编译：见下方「预编译 Rust 后端」第 ④ 段，
      # 产物落到 package/luci-app-online-upgrade/root/usr/bin/online-upgrade，
      # 正是上游 Makefile 安装段读取的路径。
      - name: 导入 luci-app-online-upgrade（全机型）
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-OnlineUpgrade.sh

          LUCI_MK="$(pwd)/../feeds/luci/luci.mk"
          if [ ! -f "$LUCI_MK" ]; then
            echo "::error::未找到 $LUCI_MK：feeds 未更新或 luci feed 未展开"
            exit 1
          fi
          echo "luci.mk 就位：$LUCI_MK"

      - name: 生成配置并执行 defconfig
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          # 显式启用 ccache：缓存落到 ./.ccache，与上面缓存的 path 对应。
          # 重复编译、仅改配置或插件时可大幅缩短耗时。
          echo "CONFIG_CCACHE=y" >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # MT 独立插件配置层：按 MT_MODE 叠加 MT5700 / MT5700M / 空（互斥）
          # 必须在 Settings.sh 之后、make defconfig 之前执行
          $GITHUB_WORKSPACE/Scripts/ApplyMTMode.sh

          make defconfig

          # 定向清理（替代 make clean）：make clean 的 _clean 规则会
          # rm -rf $(BUILD_DIR) $(STAGING_DIR) $(BIN_DIR)，把上面「恢复缓存」
          # 步骤拿回的 host*/tool* 工具链连同其时间戳一起删光，导致每次构建
          # 都从零编译工具链（数小时）且「修正缓存时间戳」步骤形同虚设。
          # 这里只移除按机型/配置变化的构建产物 build_dir 与 bin，保留
          # staging_dir；缓存命中时工具链可直接复用，缓存未命中时行为与
          # 原先一致（build_dir 为空，本就无残留可清）。
          rm -rf ./build_dir ./bin

      # 配置生成后、编译前：验证 MT 模式包选择互斥（双重验证之一）
      - name: 校验 MT 插件模式互斥
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/VerifyMTMode.sh

      # 防回归：包已就位 且 .config 已选中，缺任一都会变成
      # 「编译全绿、固件里却少一个 luci-app-fm350」这种最难查的失败。
      # 放在下载与编译之前，失配立刻红，不用等一两个小时才从产物里发现。
      - name: 校验 luci-app-fm350 已选中
        if: contains(env.WRT_CONFIG, 'FM350')
        run: |
          cd ./wrt/

          if [ ! -d ./package/luci-app-fm350 ]; then
            echo "::error::package/luci-app-fm350 不存在：Packages-FM350.sh 未执行或 clone 失败"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-fm350=y' ./.config; then
            echo "::error::.config 未选中 luci-app-fm350：包是否在 make defconfig 之前就位？"
            grep -i 'fm350' ./.config || echo "（.config 中无任何 fm350 相关行）"
            exit 1
          fi

          echo "luci-app-fm350 已就位且已被 .config 选中"

      # 防回归：与上面 fm350 校验同源。NetWiz 多一项翻译包必须一起校验 ——
      # 主包默认只带英文，luci-i18n-netwiz-zh-cn 未被选中时界面回退英文，
      # 但编译照样全绿，属「能用但不对」的静默缺陷。
      - name: 校验 luci-app-netwiz 已选中
        if: contains(env.WRT_CONFIG, 'NETWIZ')
        run: |
          cd ./wrt/

          if [ ! -d ./package/luci-app-netwiz ]; then
            echo "::error::package/luci-app-netwiz 不存在：Packages-NetWiz.sh 未执行或 clone 失败"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-netwiz=y' ./.config; then
            echo "::error::.config 未选中 luci-app-netwiz：包是否在 make defconfig 之前就位？"
            grep -i 'netwiz' ./.config || echo "（.config 中无任何 netwiz 相关行）"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-i18n-netwiz-zh-cn=y' ./.config; then
            echo "::error::.config 未选中 luci-i18n-netwiz-zh-cn：中文界面将回退英文"
            grep -i 'netwiz' ./.config || echo "（.config 中无任何 netwiz 相关行）"
            exit 1
          fi

          # 组合变体一致性：配置名以 -MT5700M / -MT5700 结尾时，对应 MT 主包
          # 必须已被 MT_MODE 驱动选中（MT 层不内嵌在配置文件里——ApplyMTMode
          # 空模式会禁用全部 MT 包，Packages.sh 的 FOLD_MT5700M 也必须由
          # MT_MODE=MT5700M 驱动）。若手动构建错配 MT_MODE（选了 NETWIZ-MT5700
          # 却把 MT Mode 留空），这里立即拦截，避免产出名不副实的固件。
          case "$WRT_CONFIG" in
            *-MT5700M)
              if ! grep -qx 'CONFIG_PACKAGE_luci-app-mt5700m=y' ./.config; then
                echo "::error::配置 $WRT_CONFIG 要求 MT_MODE=MT5700M，但 .config 未选中 luci-app-mt5700m（手动构建时 MT Mode 是否错配？）"
                grep -i 'mt5700' ./.config || echo "（.config 中无任何 mt5700 相关行）"
                exit 1
              fi
              ;;
            *-MT5700)
              if ! grep -qx 'CONFIG_PACKAGE_luci-app-mt5700=y' ./.config; then
                echo "::error::配置 $WRT_CONFIG 要求 MT_MODE=MT5700，但 .config 未选中 luci-app-mt5700（手动构建时 MT Mode 是否错配？）"
                grep -i 'mt5700' ./.config || echo "（.config 中无任何 mt5700 相关行）"
                exit 1
              fi
              ;;
          esac

          echo "luci-app-netwiz 及中文语言包已就位且已被 .config 选中"

      # 防回归：与上面 netwiz 校验同源。两个自用插件都必须确认「包已就位 且
      # .config 已选中」，缺任一都会变成「编译全绿、固件里却少了自用插件」
      # 这种最难查的失败；放在下载与编译之前，失配立刻红。
      # 另加 MT5700 一致性断言：自用配置固定使用 MT_MODE=MT5700 方案（MT 层
      # 由 ApplyMTMode 叠加，不内嵌在配置文件里）。若手动构建错配 MT Mode
      # （选了本配置却把 MT Mode 留空 / 选成 MT5700M），这里立即拦截，避免
      # 产出缺少 MT5700 模组功能的名不副实固件。
      - name: 校验 luci-app-netmonitor 已选中
        if: contains(env.WRT_CONFIG, 'NETMONITOR')
        run: |
          cd ./wrt/

          if [ ! -d ./package/luci-app-netmonitor ]; then
            echo "::error::package/luci-app-netmonitor 不存在：Packages-NetMonitor.sh 未执行或 clone 失败"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-netmonitor=y' ./.config; then
            echo "::error::.config 未选中 luci-app-netmonitor：包是否在 make defconfig 之前就位？"
            grep -i 'netmonitor' ./.config || echo "（.config 中无任何 netmonitor 相关行）"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-mt5700=y' ./.config; then
            echo "::error::配置 $WRT_CONFIG 固定使用 MT_MODE=MT5700，但 .config 未选中 luci-app-mt5700（手动构建时 MT Mode 是否错配？）"
            grep -i 'mt5700' ./.config || echo "（.config 中无任何 mt5700 相关行）"
            exit 1
          fi

          echo "luci-app-netmonitor 已就位且已被 .config 选中（MT5700 方案一致）"

      # luci-app-taygedo 的选中校验：与导入步骤同样由配置驱动，任何机型
      # 只要在 Config 里声明了该包就会走这里。三层断言分别覆盖三种真实
      # 失败形态：
      #   1. 包目录缺失 —— 取包脚本没跑 / clone 失败 / monorepo 布局变更；
      #   2. .config 未选中 —— 包在 defconfig 之后才就位（或被依赖裁掉）；
      #   3. 预编译二进制没进包 —— curl 404 被 Build/Prepare 吞掉，
      #      「编译全绿但设备上没有 /usr/bin/taygedo-rs」。
      - name: 校验 luci-app-taygedo 已选中
        if: env.WRT_TAYGEDO == 'true'
        run: |
          cd ./wrt/

          if [ ! -d ./package/luci-app-taygedo ]; then
            echo "::error::package/luci-app-taygedo 不存在：Packages-Taygedo.sh 未执行或 clone 失败"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-taygedo=y' ./.config; then
            echo "::error::.config 未选中 luci-app-taygedo：包是否在 make defconfig 之前就位？"
            grep -i 'taygedo' ./.config || echo "（.config 中无任何 taygedo 相关行）"
            exit 1
          fi

          # 两种模式的前置条件不同：源码模式看「Rust 工程是否就位且 Makefile
          # 支持本地产物优先」，预编译模式看「Release 资产是否已落到 dl/」。
          # 用 glob 而不是重算 triple，避免与脚本里的架构推导逻辑分叉。
          if [ -f ./package/luci-app-taygedo/rust/Cargo.toml ]; then
            if ! grep -q 'TAYGEDO_LOCAL_BIN' ./package/luci-app-taygedo/Makefile; then
              echo "::error::包 Makefile 未声明 TAYGEDO_LOCAL_BIN：本地产物会被忽略，源码编译白做"
              exit 1
            fi
            echo "luci-app-taygedo 已就位、已被 .config 选中，Rust 工程在 rust/ 就绪（源码编译模式）"
          else
            # 后缀必须是 -openwrt：无后缀那份是自带 WebUI 的通用版，取错等于
            # 把已从 OpenWrt 产物里移除的 WebUI 又塞回路由器。
            TG_ASSET=$(ls ./dl/taygedo-rs-*-openwrt.tar.gz 2>/dev/null | head -n1 || true)
            if [ -z "$TG_ASSET" ]; then
              echo "::error::dl/ 中没有 taygedo-rs-*-openwrt.tar.gz：预编译二进制未就位，固件会缺少 /usr/bin/taygedo-rs"
              ls -l ./dl/ 2>/dev/null | grep -i taygedo || echo "（dl/ 中无任何 taygedo 相关文件）"
              exit 1
            fi
            echo "luci-app-taygedo 已就位、已被 .config 选中，预编译资产 $(basename "$TG_ASSET") 在 dl/ 就绪（预编译模式）"
          fi

      # 防回归：luci-app-online-upgrade 全机型内置，因此本校验无 if 条件。
      # 四层断言对应四类真实失败形态：
      #   1. 包目录缺失 —— 导入步骤没跑 / clone 失败；
      #   2. .config 未选中 —— 包在 defconfig 之后才就位，符号被静默丢弃；
      #   3. Makefile 安装段路径变了 —— 预编译产物落点会失效（源码在
      #      Build/Compile 为空，二进制完全依赖外部预置）；
      #   4. 预设与机型不匹配 —— 例如 H5000M 的资产正则跑到 X86 固件里，
      #      表现为设备上「检查更新一直找不到资产」，编译却全绿。
      # 二进制本体由「预编译 Rust 后端」④ 产出，那一步已有架构核验，不在此重复。
      - name: 校验 luci-app-online-upgrade 已选中且预设有对应机型
        run: |
          cd ./wrt/

          if [ ! -d ./package/luci-app-online-upgrade ]; then
            echo "::error::package/luci-app-online-upgrade 不存在：Packages-OnlineUpgrade.sh 未执行或 clone 失败"
            exit 1
          fi

          if ! grep -qx 'CONFIG_PACKAGE_luci-app-online-upgrade=y' ./.config; then
            echo "::error::.config 未选中 luci-app-online-upgrade：包是否在 make defconfig 之前就位？"
            grep -i 'online-upgrade' ./.config || echo "（.config 中无任何 online-upgrade 相关行）"
            exit 1
          fi

          if ! grep -q './root/usr/bin/online-upgrade' ./package/luci-app-online-upgrade/Makefile; then
            echo "::error::包 Makefile 的安装段不再读取 ./root/usr/bin/online-upgrade，预编译产物落点需同步调整"
            exit 1
          fi

          PRESET=./files/etc/config/online-upgrade
          if [ ! -f "$PRESET" ]; then
            echo "::error::$PRESET 不存在：Scripts/OnlineUpgradePreset.sh 未执行"
            exit 1
          fi

          # 设备前缀必须与本次构建产物一致（WRT_DEVICE 由 WRT_CONFIG 推导）
          if ! grep -qF "option firmware_pattern '^${WRT_DEVICE}-" "$PRESET"; then
            echo "::error::$PRESET 的 firmware_pattern 与本机型 ${WRT_DEVICE} 不匹配"
            grep 'firmware_pattern' "$PRESET" || true
            exit 1
          fi

          # Release 归组同理：tag 必须落在本机型本次构建的组里
          if ! grep -qF "option tag 'latest@^${WRT_TAG_GROUP}-'" "$PRESET"; then
            echo "::error::$PRESET 的 tag 与本次构建归组 ${WRT_TAG_GROUP} 不匹配"
            grep 'option tag' "$PRESET" || true
            exit 1
          fi

          echo "luci-app-online-upgrade 已就位、已被 .config 选中，升级预设匹配机型 ${WRT_DEVICE} / 归组 ${WRT_TAG_GROUP}"

      - name: 预下载源码包
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 只在并行下载失败时才做串行兜底，不再每次都跑两遍全量校验
          make download -j$(nproc) || make download -j1

      # 与上面「恢复缓存（下载源码包）」配对：dl 目录在预下载后即定型，
      # 立即保存可让同分支的后续机型直接命中；always() 保证下载失败时把已抓到的
      # 部分也存下来，下次不必从零开始。
      - name: 保存缓存（下载源码包）
        if: always() && env.WRT_TEST != 'true' && steps.cache-dl-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: wrt-dl-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          path: |
            ./wrt/dl

      # 上游包源码一更新，客制补丁的 context 就可能对不上，prepare 阶段报
      # `Hunk #N FAILED` 直接中断整包编译，而补丁语义其实并没过时。
      # 例：firewall4 2026.10.26 把 zone.dflags.helper 的初值从 true 改成 false，
      #     fullcone 补丁第 8 个 hunk 的上下文行因此失配，X86/MT5700 全挂。
      # 这里在 build_dir 解包之前做一次离线预检：能原样打上的补丁一字不改，
      # 只对失配 hunk 按「删除行唯一锚点」重建上下文，重建后必须整体 dry-run
      # 通过才写回，否则保持原样并非 0 退出（宁可在 1 分钟内报错，也不耗 40 分钟）。
      # 上游把补丁补齐后本步骤自动 no-op，可长期保留。
      - name: 校正客制补丁上下文（上游源码漂移兜底）
        if: env.WRT_TEST != 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/Scripts/PatchRebase.py" \
            --wrt ./wrt --package package/network/config/firewall4

      # ── Rust 后端统一预编译（官方 Rust SDK，buildroot 外交叉编译）──────────
      # luci-app-mt5700 / luci-app-h5000m-fancontrol / luci-app-fm350 过去把
      # cargo 埋在包内 Makefile，随固件编译在 build_dir 里每次冷编（build_dir
      # 每轮清空），且依赖 buildroot 环境的 CARGO_HOME/PATH 透传 —— 2026-11-06
      # 五个工作流全红正是这条链路（链接器回退 cc）。现在统一在 runner 侧用
      # rustup 官方工具链交叉编译（同 taygedo / airpi 的既有路径），产物放回
      # 包目录，包 Makefile 里的 CI-RUST-PREBUILT 守卫块直接取用；
      # rustc/cargo 始终来自官方 SDK，绝不触发 OpenWrt 的 rust/host 源码构建。
      #
      # 缓存：Cargo.lock 指纹做 key，.rust-build/<包>/target 与 cargo 注册表
      # 整体缓存 —— 依赖不变时只增量重编业务 crate（秒级），这是本轮编译
      # 速度优化的主要来源。
      - name: 计算 Rust 依赖缓存键
        if: env.WRT_TEST != 'true'
        run: |
          mkdir -p ./wrt/.rust-build
          H="$(find ./wrt/package -maxdepth 4 -type f -name Cargo.lock -print0 2>/dev/null \
            | sort -z | xargs -0 cat 2>/dev/null | sha1sum | cut -d' ' -f1)"
          echo "RUST_DEPS_HASH=${H:-none}" >> "$GITHUB_ENV"
          echo "Rust 依赖指纹：${H:-none}"

      - name: 恢复缓存（Rust 交叉编译产物 & cargo 注册表）
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v6
        with:
          key: wrt-rust-${{env.WRT_TARGET}}-${{env.RUST_DEPS_HASH}}
          restore-keys: |
            wrt-rust-${{env.WRT_TARGET}}-
            wrt-rust-
          path: |
            ./wrt/.rust-build
            ./wrt/package/luci-app-airpi-fancontrol/src/target
            ./wrt/package/luci-app-taygedo/rust/target
            ~/.cargo/registry
            ~/.cargo/git

      - name: 预编译全部 Rust 后端（官方 Rust SDK 交叉编译）
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          SCRIPT="$GITHUB_WORKSPACE/Scripts/Build-Rust-Prebuilt.sh"
          RC=0

          # ① luci-app-mt5700（MT5700 方案：at-webserver，含 rustls/ring）
          if [ -f ./package/luci-app-mt5700/src/rust/Cargo.toml ] \
            && grep -qx 'CONFIG_PACKAGE_luci-app-mt5700=y' ./.config; then
            echo "::group::① luci-app-mt5700（at-webserver）"
            bash "$SCRIPT" ./package/luci-app-mt5700 src/rust at-webserver || RC=1
            echo "::endgroup::"
          fi

          # ② luci-app-h5000m-fancontrol（零依赖 crate，静态 musl）
          if [ -f ./package/luci-app-h5000m-fancontrol/src/Cargo.toml ] \
            && grep -qx 'CONFIG_PACKAGE_luci-app-h5000m-fancontrol=y' ./.config; then
            echo "::group::② luci-app-h5000m-fancontrol"
            bash "$SCRIPT" ./package/luci-app-h5000m-fancontrol src h5000m-fancontrol --offline || RC=1
            echo "::endgroup::"
          fi

          # ③ luci-app-fm350（fm350d，FM350 / NetWiz-FM350 变体）
          if [ -f ./package/luci-app-fm350/rust/Cargo.toml ] \
            && grep -qx 'CONFIG_PACKAGE_luci-app-fm350=y' ./.config; then
            echo "::group::③ luci-app-fm350（fm350d）"
            bash "$SCRIPT" ./package/luci-app-fm350 rust fm350d || RC=1
            echo "::endgroup::"
          fi

          # ④ luci-app-online-upgrade（在线升级后端，全机型）
          #
          # 与上面三个包不同：上游 Makefile 的 Build/Prepare 与 Build/Compile
          # 都是空实现，安装段直接 INSTALL_BIN ./root/usr/bin/online-upgrade。
          # 即二进制必须由外部预置，buildroot 不会替我们编译。因此这里用
          # RUST_NO_INJECT=1（不改上游 Makefile，避免下次换上游版本时注入块漂移），
          # 并把产物直接落到安装段读取的路径。
          #
          # 包内 rust/ 依赖 ring（rustls），必须用 OpenWrt 的 musl 交叉链接器，
          # 因此必须放在工具链就绪之后 —— 当前位置满足（①②③ 已拉通同一链路）。
          # 失败不在此静默：RC=1 会让本步骤红掉，避免带着缺二进制的包继续编译，
          # 到安装阶段才报「online-upgrade: No such file」。
          if [ -f ./package/luci-app-online-upgrade/rust/Cargo.toml ] \
            && grep -qx 'CONFIG_PACKAGE_luci-app-online-upgrade=y' ./.config; then
            echo "::group::④ luci-app-online-upgrade（online-upgrade）"
            RUST_NO_INJECT=1 \
              RUST_OUT_BIN="$(pwd)/package/luci-app-online-upgrade/root/usr/bin/online-upgrade" \
              bash "$SCRIPT" ./package/luci-app-online-upgrade rust online-upgrade || RC=1
            # 落点复核：脚本成功但文件不在预期位置（例如上传/复制被跳过）时，
            # 安装阶段才会报「online-upgrade: No such file」，这里先拦。
            if [ ! -s ./package/luci-app-online-upgrade/root/usr/bin/online-upgrade ]; then
              echo "::error::预编译产物未落到 package/luci-app-online-upgrade/root/usr/bin/online-upgrade"
              RC=1
            fi
            echo "::endgroup::"
          fi

          echo "==== 本轮 Rust 预编译清单 ===="
          cat ./.rust-build/BUILD-INDEX 2>/dev/null || echo "（本变体无 Rust 插件）"
          exit $RC

      # 关键改动 3：AP3000M 跳过 rust/host 源码构建
      #   luci-app-airpi-fancontrol 的守护进程 airpi-fanctl 是 Rust 写的，
      #   默认路径会让 OpenWrt 从源码构建整套 rust/host（rustc + cargo + LLVM），
      #   约 1.5~3 小时。这里用 runner 自带的 rustup 配合已构建好的 aarch64 musl
      #   交叉链接器直接 cargo，再通过 AIRPI_PREBUILT=1 交给包 Makefile。
      - name: 预编译 AirPi Rust 后端（AP3000M）
        if: contains(env.WRT_CONFIG, 'AP3000M') && env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          PKG_DIR="$(pwd)/package/luci-app-airpi-fancontrol"
          PREBUILT_DIR="$(pwd)/airpi-prebuilt"

          if [ ! -f "$PKG_DIR/src/Cargo.toml" ]; then
            echo "::warning::未找到 $PKG_DIR/src/Cargo.toml，跳过预编译（将由源码构建 rust/host）"
            exit 0
          fi

          # 失败即回退的正确写法：先在父 shell 关闭 errexit（GHA 的 run 默认是
          # bash -e），再把受保护子 shell 当作普通语句执行并取回退出码。
          set +e
          (
            set -euxo pipefail

            # 命中缓存时秒过，冷编译才会真正构建工具链
            make toolchain/install -j$(nproc)

            LINKER="$(find "$(pwd)/staging_dir" -type f -name 'aarch64-openwrt-linux-musl-gcc' -perm -111 | head -1)"
            [ -n "$LINKER" ] || LINKER="$(find "$(pwd)/staging_dir" -type f -name 'aarch64-*linux-musl-gcc' -perm -111 | head -1)"
            [ -n "$LINKER" ] || { echo "未找到 aarch64 musl 交叉链接器"; exit 1; }
            LINKER="$(readlink -f "$LINKER")"
            echo "使用交叉链接器: $LINKER"

            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add aarch64-unknown-linux-musl

            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$LINKER"

            cd "$PKG_DIR/src"
            cargo build --locked --release --target aarch64-unknown-linux-musl

            # 产物自检：cargo 退出 0 但产物缺失同样按失败处理
            BIN="target/aarch64-unknown-linux-musl/release/airpi-fanctl"
            [ -f "$BIN" ] || { echo "cargo 未产出 $BIN"; exit 1; }

            mkdir -p "$PREBUILT_DIR"
            cp -f "$BIN" "$PREBUILT_DIR/airpi-fanctl"

            python3 "$GITHUB_WORKSPACE/Scripts/inject_airpi_prebuilt.py" "$PKG_DIR/Makefile"
          )
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "airpi-fanctl 预编译完成，本次将跳过 rust/host 构建"
          else
            echo "::warning::airpi-fanctl 预编译失败（rc=$RC），回退到源码构建 rust/host（本次编译将额外增加约 1.5~3 小时）"
            rm -rf "$PREBUILT_DIR"
          fi

          # 一致性兜底：标记存在但二进制缺失时主动撤销注入
          if grep -q '^AIRPI_PREBUILT:=1$' "$PKG_DIR/Makefile" && [ ! -f "$PREBUILT_DIR/airpi-fanctl" ]; then
            echo "::warning::预编译标记与二进制不一致，撤销注入并回退源码构建"
            sed -i '/^AIRPI_PREBUILT:=1$/d; /^AIRPI_PREBUILT_BIN:=/d' "$PKG_DIR/Makefile"
            rm -rf "$PREBUILT_DIR"
          fi

      # luci-app-taygedo：从源码交叉编译 Rust 后端（openwrt feature 形态）。
      #
      # 为什么放在这里而不是「导入插件」阶段：
      #   make toolchain/install 要求 .config 已生成（即 defconfig 之后），而
      #   固件编译本身也要这份工具链，提前构建只是调换顺序、不增加总时长；
      #   放在 defconfig 之前反而会因为不知道目标架构而无法定位 triple。
      #
      # 与上面「预编译 AirPi Rust 后端」是同一套思路：宿主机 rustup + OpenWrt
      # staging_dir 里自带的 <arch>-openwrt-linux-musl-gcc 作链接器。区别在于
      # taygedo 依赖 ring（含 C 与汇编），脚本内置 cross（Docker）兜底，避免
      # rustc 自带 musl 与 OpenWrt sysroot 的差异把整条固件构建拖死。
      #
      # 产物落在 package/luci-app-taygedo/local/taygedo-rs，包 Makefile 见到
      # 即跳过 Release 下载，install 段不变。
      - name: 编译 luci-app-taygedo Rust 后端（源码交叉编译）
        if: env.WRT_TAYGEDO == 'true' && env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          if [ ! -f "$GITHUB_WORKSPACE/Scripts/Build-Taygedo.sh" ]; then
            echo "::error::Scripts/Build-Taygedo.sh 缺失：源码编译模式无法执行"
            exit 1
          fi

          $GITHUB_WORKSPACE/Scripts/Build-Taygedo.sh ./package/luci-app-taygedo

          # 二次确认：脚本退出码为 0 但产物缺失同样视为失败，避免「编译全绿、
          # 固件里没有 taygedo-rs」的静默降级。
          if [ ! -s ./package/luci-app-taygedo/local/taygedo-rs ]; then
            echo "::error::package/luci-app-taygedo/local/taygedo-rs 不存在：源码编译未产出二进制"
            exit 1
          fi
          ls -l ./package/luci-app-taygedo/local/

      # 与上方「恢复缓存（Rust 交叉编译产物 & cargo 注册表）」配对。放在
      # airpi / taygedo 预编译之后：三个包 + 统一脚本的产物一次收齐。
      # always()：预编译失败时把已完成的注册表/目标目录也存下来，下次少编。
      - name: 保存缓存（Rust 交叉编译产物 & cargo 注册表）
        if: always() && env.WRT_TEST != 'true'
        uses: actions/cache/save@v6
        with:
          key: wrt-rust-${{env.WRT_TARGET}}-${{env.RUST_DEPS_HASH}}
          path: |
            ./wrt/.rust-build
            ./wrt/package/luci-app-airpi-fancontrol/src/target
            ./wrt/package/luci-app-taygedo/rust/target
            ~/.cargo/registry
            ~/.cargo/git

      - name: 编译固件
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 指向被缓存的 .ccache 目录，限制容量并开启压缩，避免占满 10GB 配额
          export CCACHE_DIR="$(pwd)/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          ccache -z 2>/dev/null || true

          # 关键改动 4：失败重试必须保持并行。
          #   原来的 `make -j$(nproc) || make -j1 V=s` 一旦偶发失败就退化成单线程，
          #   几小时的编译会直接拖过上限被取消。
          #   输出同时写入 build.log，失败时提取首个出错包并以 ::error:: 注解上报。
          #   必须关闭 errexit：GHA 的 run 以 bash -e 执行，开了 pipefail 后
          #   首次 make 失败会让整个步骤就地终止，重试与诊断分支永远不会执行。
          set +e -o pipefail

          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo "第一次编译失败（rc=$RC），保持并行重试并追加日志"
            make -j$(nproc) V=s 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::group::编译失败诊断"

            # 注解提取按「根因优先」分层：旧正则要求 ERROR 行同时含
            # failed to build / Error N / too big，漏掉 apk 安装期冲突与依赖失败
            #（如 trying to overwrite / unable to select packages / package version
            # is invalid），注解里只剩 make 级联行，真实原因不可见。
            # 分层顺序：apk 根因 → 包编译失败 → make 级联 → ERROR 兜底。
            # awk '!seen[$0]++' 保留首次出现顺序，层内 sort -u 去重。
            ANN=$(mktemp)
            : > "$ANN"

            # 第 1 层：apk/opkg 安装期根因（文件归属冲突、依赖解析、版本非法）
            grep -E "ERROR: .*(trying to overwrite|unable to select packages|package version is invalid|breaks:|conflicts with|installed .* is newer)" build.log \
              | sort -u | head -n 6 >> "$ANN" || true

            # 第 2 层：包编译失败 / 镜像过大（兼容旧关键字）
            grep -E "^(ERROR: |make(\\[[0-9]+\\])?: \*\*\* ).*(failed to build|Error [0-9]|too big)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true
            grep -E "^ERROR: .*(failed to build|too big)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true

            # 第 3 层：make 级联（根因缺失时的兜底）
            grep -E "^make(\\[[0-9]+\\])?: \*\*\* .*(Error [0-9]|Stop)" build.log \
              | sort -u | head -n 4 >> "$ANN" || true

            # 第 4 层：仍无命中时，放宽到任意 ERROR: 行
            if [ ! -s "$ANN" ]; then
              grep -E "^ERROR: " build.log | sort -u | head -n 8 >> "$ANN" || true
            fi

            if [ ! -s "$ANN" ]; then
              echo "::error::未匹配到包级错误行，输出日志末尾 30 行"
              tail -n 30 build.log
            else
              awk '!seen[$0]++' "$ANN" | head -n 12 | while IFS= read -r LINE; do
                [ -n "$LINE" ] && echo "::error::$LINE"
              done
              echo "--- 编译错误上下文（C/C++ / 链接 / apk 安装）---"
              grep -nE "error:|Error [0-9]+|collect2:|undefined reference|too big|trying to overwrite|unable to select packages|package version is invalid|breaks:" build.log \
                | head -n 30
            fi

            rm -f "$ANN"
            echo "::endgroup::"
          fi

          ccache -s 2>/dev/null || true

          exit "$RC"

      # 与上面「恢复缓存（工具链 & ccache）」配对。位置必须在「整理并打包固件」
      # 之前：该步骤内的 make clean 会清空 staging_dir，届时已无内容可缓存。
      # always() 让编译失败/超时被取消时也能保住工具链，避免每次冷启动。
      - name: 保存缓存（工具链 & ccache）
        if: always() && env.WRT_TEST != 'true' && steps.cache-tc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: wrt-tc-${{env.WRT_TARGET}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 输出构建机信息
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: 整理并打包固件
        run: |
          cd ./wrt/ && mkdir ./upload/

          # 编译配置只在 TEST（仅出配置）模式导出供人工核对；正式构建的
          # Release 只收固件，不再附带 Config-*.txt / manifest 等文本辅助文件。
          if [[ $WRT_TEST == 'true' ]]; then
            cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_MT".txt
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV

            # 插件清单：从 manifest 提取 LuCI 插件 / 主题名。
            # 关键：必须先落到普通 shell 变量再判断 —— GITHUB_ENV 的写入要到
            # 下一个 step 才对本进程可见，同一 step 内读 $WRT_LIST 拿到的
            # 永远是「初始化构建变量」步骤写入的旧值（none），导致 Release
            # 的「插件清单」永远显示「未采集到插件清单」。
            WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -hoP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')
            echo "WRT_LIST=$WRT_LIST" >> $GITHUB_ENV

            # 插件清单转 Markdown 列表（去重排序，几十个包挤一行没法读）。
            # GITHUB_ENV 多行值用官方 heredoc 语法写入。
            if [ -n "$WRT_LIST" ]; then
              {
                echo "WRT_LIST_MD<<GITHUB_ENV_LIST_EOF"
                printf '%s\n' $WRT_LIST | sort -u | awk '{printf "- `%s`\n", $0}'
                echo "GITHUB_ENV_LIST_EOF"
              } >> $GITHUB_ENV
            else
              echo "WRT_LIST_MD=（未采集到插件清单）" >> $GITHUB_ENV
            fi

            # 清掉编译辅助文件。注意原生 sha256sums 记录的是「编译输出的
            # 原始文件名」，固件重命名后它会全部指向不存在的文件 —— 因此
            # 这里一并删掉，稍后在 upload 里按重命名后的固件名重新生成。
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            # 固件统一重命名：<机型>-<模组插件>-<编译日期>-<固件类型>.<扩展名>
            #   例：H5000M-MT5700-26.11.09-sysupgrade.bin
            #       AP3000M-NetWiz-FM350-26.11.09-factory.bin
            #       X86-NetWiz-MT5700-26.11.09-efi.img.gz
            #       H5000M-SelfUse-26.11.09-sysupgrade.bin
            #   - 机型：WRT_DEVICE（H5000M / AP3000M / X86），同一 Release 汇聚
            #     多设备时靠它消歧；
            #   - 模组插件：WRT_FLAVOR（NetWiz-MT5700 / MT5700 / FM350 /
            #     SelfUse / BASE），全 ASCII，各变体不再撞名；
            #   - 编译日期：WRT_DATE_SHORT（YY.MM.DD），与 Tag 同源。它既是
            #     版本标识（插件 version::pick 从这里解析），也避免不同日期
            #     的产物同名互相覆盖；
            #   - 固件类型：sysupgrade / factory / initramfs / recovery / efi /
            #     combined / efi-iso / iso / efi-vmdk / vmdk，保留刷机方式判断
            #     所必需的信息，只改文件名，不改固件内容与刷写用途。
            # Releases 只收「可直接刷写的完整镜像」+ 配套 SHA256 校验文件：
            # Config / manifest / kernel.bin / rootfs 分片等非固件辅助文件一律
            # 不进 upload；校验文件在重命名完成后按新固件名重新生成。
            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              BASE=$(basename "$FILE")
              case "$BASE" in
                *.bin|*.img|*.gz|*.iso|*.vmdk) ;;  # 固件候选，统一重命名
                *) continue ;;                      # 文本/清单等辅助文件：不搬进 upload
              esac
              EXT=$(echo "$BASE" | cut -d '.' -f 2-)
              STEM="${BASE%.*}"
              # 类型识别（顺序即优先级）：明确刷机类型 → UEFI/legacy 区分 →
              # 分片 → ISO / VMDK 兜底。用 $BASE 判断以便区分 *.iso / *.vmdk，
              # 不让两个 ISO 撞成同一个名字。
              case "$BASE" in
                *sysupgrade*)   TYPE=sysupgrade ;;
                *factory*)      TYPE=factory ;;
                *initramfs*)    TYPE=initramfs ;;
                *recovery*)     TYPE=recovery ;;
                *combined-efi*) TYPE=efi ;;
                *combined*)     TYPE=combined ;;
                *rootfs*)       TYPE=rootfs ;;
                *kernel*)       TYPE=kernel ;;
                *-efi.iso)      TYPE=efi-iso ;;
                *.iso)          TYPE=iso ;;
                *-efi.vmdk)     TYPE=efi-vmdk ;;
                *.vmdk)         TYPE=vmdk ;;
                *-efi*)         TYPE=efi ;;
                *)              TYPE=image ;;
              esac
              # rootfs / kernel 是编译分片而非可直接刷写的完整固件，不发布
              case "$TYPE" in
                rootfs|kernel) continue ;;
              esac
              NEW_BASE="$WRT_DEVICE-$WRT_FLAVOR-$WRT_DATE_SHORT"
              [ -n "$TYPE" ] && NEW_BASE="$NEW_BASE-$TYPE"
              NEW_FILE="$NEW_BASE.$EXT"
              # 防冲突兜底：同机型同方案同日期同类型出现多文件时，先追加
              # 文件系统段（squashfs / ext4），再不行才追加源文件名短哈希。
              if [ -e "./upload/$NEW_FILE" ]; then
                FS=$(echo "$STEM" | grep -ioE 'squashfs|ext4' | tail -n 1 || true)
                if [ -n "$FS" ] && [ ! -e "./upload/$NEW_BASE-$FS.$EXT" ]; then
                  NEW_FILE="$NEW_BASE-$FS.$EXT"
                else
                  SUFFIX=$(echo "$BASE" | md5sum | cut -c 1-6)
                  NEW_FILE="$NEW_BASE-$SUFFIX.$EXT"
                fi
              fi
              mv -f "$FILE" "./upload/$NEW_FILE"
            done

            # 过滤非固件小文件：mediatek 目标编译时会把 mt798x-ram-*-bl2 等
            # DDR 引导辅助 bin（<1MB，仅供开发者二次拼包，不可直接刷写）输出到
            # bin/targets，可能被上面的循环当成固件搬进 upload。真正的固件
            # bin 都是几十 MB，按「.bin 且小于 2MB 即非固件」过滤。
            find ./upload/ -type f -iname "*.bin" -size -2M -print -delete

            # 净化 upload：只保留本次机型 / 本次编译日期、符合新命名规范的
            # 完整固件，任何旧格式残留或辅助文本都剔除。校验文件随后按
            # 净化后的固件重新生成，保证 Release 只含固件 + 配套校验。
            find ./upload/ -maxdepth 1 -type f \
              ! -name "$WRT_DEVICE-$WRT_FLAVOR-$WRT_DATE_SHORT-*" -print -delete

            # 重新生成 SHA256 校验文件（基于「重命名后的固件名」，而非编译原始名）：
            #   - sha256sums        标准聚合表，sha256sum -c sha256sums 人工校验，
            #                       也是插件 checksum_asset 的来源（find_sha256_in_text
            #                       按目标固件文件名逐行匹配，故行里必须是新固件名）；
            #   - <固件名>.sha256   每个固件一份单哈希文件，插件按
            #                       {目标固件名}.sha256 精确命中，单哈希不会被
            #                       extract_single_sha256 判为歧义；同组多机型 job
            #                       追加进同一 Release 时文件名天然唯一，不会像单份
            #                       sha256sums 那样被 --clobber 互相覆盖。
            # 只覆盖 upload 里已净化的完整固件，不含任何辅助文件。
            cd ./upload/
            : > sha256sums
            for FW in "$WRT_DEVICE"-"$WRT_FLAVOR"-"$WRT_DATE_SHORT"-*; do
              [ -f "$FW" ] || continue
              case "$FW" in *.sha256|sha256sums) continue ;; esac
              SUM=$(sha256sum "$FW")
              printf '%s\n' "$SUM" >> sha256sums
              printf '%s\n' "$SUM" > "$FW.sha256"
            done
            cd ../
            echo "==> SHA256 校验：" && cat ./upload/sha256sums

            if ! ls ./upload/*.* >/dev/null 2>&1; then
              echo "::error::整理后 upload 为空，本次未产出任何固件"
              exit 1
            fi
            echo "==> 待发布固件：" && ls -lh ./upload/

            make clean -j$(nproc)
          fi

      # 发布固件到 Release。
      #   softprops/action-gh-release 在并发上传多文件时偶发 GitHub 服务端
      #   断连（`other side closed`），导致「编译成功但发布标红」的假失败。
      #   改用原生 gh CLI：多个 job 并行调用时对同一 Tag 天然幂等
      #   （已存在则 create 报错 + 复用；产物 upload --clobber 追加/覆盖既有文件），
      #   并单文件串行上传 + 失败重试，杜绝单文件断连拖垮整个步骤。
      # Tag 按产品/变体分类归组：<组名>-<YY.MM.DD>。同组同一天的多个机型 job
      # 共享同一 Tag，产物追加进同一个 Release，Releases 页面即按
      # NetWiz / MT5700 / MT5700M / FM350 / 自用 / BASE 天然归类。
      # body 为结构化 Markdown，分四段：
      #   ① 头部说明（本组定位）；
      #   ② 📦 下载一览 —— 产物上传完成后从 Release 现有资产反向生成、按机型
      #      （H5000M / AP3000M / X86 / 通用）分节，带下载链接、体积与用途。
      #      读取 Release 全量资产而非本 job 的 upload 目录：无论同组多机型
      #      job 谁最后完成，body 都能列出全部机型产物索引，从根上避免
      #      「后完成 job 覆盖 body 后只见自己文件」；
      #   ③ 🗂️ 组别速查 / ⚙️ 默认出厂参数 / 🔧 本批构建信息（后者为最后
      #      完成机型的数据，已显式标注）；
      #   ④ 插件清单折叠块（details）。
      # Release 标题同步美化：<组名中文释义> · <日期>，Releases 列表页不再
      # 直接裸奔 tag 名。产物 → 机型的映射与打包阶段的重命名规则一一对应。
      - name: 发布固件到 Release
        if: env.WRT_TEST != 'true'
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          set -euo pipefail
          BODY_HEAD="${{env.WRT_TAG_GROUP}}_head.md"
          BODY_TAIL="${{env.WRT_TAG_GROUP}}_tail.md"
          BODY_DL="${{env.WRT_TAG_GROUP}}_dl.md"
          BODY="${{env.WRT_TAG_GROUP}}_body.md"

          # ① 头部说明。heredoc 定界符加引号：脚本里的 GHA 表达式（双花括号
          #    那种占位写法，注意注释里都不能出现字面写法，否则整个工作流
          #    文件会被 GHA 判为非法）已在脚本注入前被文本替换，之后不能再
          #    让 bash 做变量展开
          cat > "$BODY_HEAD" <<'EOF'
          > 同一天内全部机型的 **${{env.WRT_TAG_GROUP}}** 分类固件汇聚于此，下方「下载一览」按机型分节。本仓库 Releases 按「产品/配置本身」分类，认准组名下载即可。

          EOF

          # ② 尾部静态说明
          cat > "$BODY_TAIL" <<'EOF'
          ## 🗂️ 组别速查

          | 组名 | 适用场景 |
          | :--- | :--- |
          | `NetWiz` | NetWiz 网络配置向导（独立产品：`NetWiz-MT5700` / `NetWiz-MT5700M` / `NetWiz-FM350` 全部归此组，即使含 MT / FM350 插件也不进入对应插件分类） |
          | `MT5700` | 普通 MT5700 模组方案（方案 B，单包内置 Rust 后端，仅非 NetWiz 产品） |
          | `MT5700M` | 普通 MT5700M 模组方案（方案 A，含短信与 AT 守护，仅非 NetWiz 产品） |
          | `FM350` | 普通 Fibocom FM350-GL 模组管理（RNDIS 数据通道，仅非 NetWiz 产品） |
          | `自用` | 个人自用配置（H5000M + NetMonitor 网络监控 + Taygedo 签到，MT5700 方案，不进入公开 MT5700 分类） |
          | `BASE` | 无变体基础构建（手动触发） |

          ## ⚙️ 默认出厂参数

          | 项目 | 值 |
          | :--- | :--- |
          | 后台地址 | `${{env.WRT_IP}}` |
          | 后台密码 | `${{env.WRT_PW}}` |
          | Wi-Fi | `${{env.WRT_SSID}}` / `${{env.WRT_WORD}}`（WPA 混合加密） |

          ## 🔧 本批构建信息

          > 多机型产物追加进同一 Release 时，本节为最后完成机型的数据，仅作参考。

          - 源码：`${{env.WRT_REPO}}`（`${{env.WRT_BRANCH}}` @ `${{env.WRT_HASH}}`）
          - 配置：`${{env.WRT_CONFIG}}` · MT 模式：`${{env.WRT_MT}}` · 归组：`${{env.WRT_TAG_GROUP}}`
          - 平台：`${{env.WRT_TARGET}}` · 内核：`${{env.WRT_KVER}}`

          <details>
          <summary>插件清单（点开展开）</summary>

          ${{env.WRT_LIST_MD}}

          </details>
          EOF

          # ③ 创建 / 复用 Release（同组同日多 job 追加：已存在则复用）。
          #    先以「头部 + 尾部」占位并创建，产物上传完成后④再重写完整 body ——
          #    即使本 job 上传中途失败，页面也保留完整的组别说明。
          cat "$BODY_HEAD" "$BODY_TAIL" > "$BODY"
          if gh release view "$WRT_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release 已存在（$WRT_RELEASE_TAG），追加产物"
          else
            gh release create "$WRT_RELEASE_TAG" --notes-file "$BODY"
          fi

          # 产物上传：单文件串行 + 失败重试（最多 5 次，间隔 5s），规避服务端断连。
          # upload 已在「整理并打包固件」阶段净化，这里再加一道命名白名单，
          # 只上传本次机型 / 日期的固件及其 <固件名>.sha256 校验文件（两者都
          # 以机型前缀开头，同一 glob 覆盖），杜绝非固件资产混入 Release。
          for f in ./wrt/upload/"$WRT_DEVICE"-"$WRT_FLAVOR"-"$WRT_DATE_SHORT"-*.*; do
            [ -f "$f" ] || continue
            attempt=0
            until gh release upload --clobber "$WRT_RELEASE_TAG" "$f"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "::error::上传失败（已重试 5 次）：$f"
                exit 1
              fi
              echo "上传 $f 失败（第 ${attempt} 次，5s 后重试）..."
              sleep 5
            done
          done

          # SHA256 校验总表：同组同日多机型 job 共享同一 Tag，直接上传会被
          # 后完成的 job --clobber 覆盖、丢掉其它机型的条目。先下载已有表、
          # 按「文件名」去重合并（本次结果覆盖同名旧条目），再上传。
          # 每个固件的 <固件名>.sha256 已在上面的白名单循环里随固件上传，
          # 文件名唯一、不会互相覆盖，是插件校验的主路径；总表主要供人工
          # sha256sum -c sha256sums 使用，即使被覆盖也不影响在线升级。
          CHK="./wrt/upload/sha256sums"
          if [ -f "$CHK" ]; then
            mkdir -p ./chk_prev
            gh release download "$WRT_RELEASE_TAG" --pattern sha256sums --dir ./chk_prev --clobber >/dev/null 2>&1 || true
            if [ -f ./chk_prev/sha256sums ]; then
              awk 'NF >= 2 { line[$2] = $0 } END { for (k in line) print line[k] }' \
                ./chk_prev/sha256sums "$CHK" | sort -k2,2 > "${CHK}.merged"
              mv -f "${CHK}.merged" "$CHK"
            fi
            attempt=0
            until gh release upload --clobber "$WRT_RELEASE_TAG" "$CHK"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then
                echo "::error::上传 sha256sums 失败（已重试 5 次）"
                exit 1
              fi
              echo "上传 sha256sums 失败（第 ${attempt} 次，5s 后重试）..."
              sleep 5
            done
          fi

          # ④ 下载一览：从 Release 现有资产反向生成，按机型分节（含同组其他
          #    job 已追加的产物）。资产名 → 机型 / 用途的映射见下方两个 case。
          : > "$BODY_DL"
          {
            echo "## 📦 下载一览（按机型）"
            echo
            echo "> 文件命名：\`<机型>-<模组插件>-<编译日期>-<固件类型>.<扩展名>\`（如 \`H5000M-MT5700-26.11.09-sysupgrade.bin\`）。日期段 \`YY.MM.DD\` 即编译日期，也是 \`luci-app-online-upgrade\` 从资产名解析出的版本号；与「用途」列对照选择即可。"
            echo
            echo "> 本 Release 只收录可直接刷写的完整固件镜像，以及每个固件对应的 SHA256 校验文件（\`sha256sums\` 总表与 \`<固件名>.sha256\`）；不含编译配置、插件清单、内核 / 根文件系统分片等辅助文件。校验文件按重命名后的固件名生成，可用 \`sha256sum -c sha256sums\` 人工核对，\`luci-app-online-upgrade\` 的 \`expected_sha256\` 留空时也会自动读取。"
            echo
          } >> "$BODY_DL"

          declare -A ROWS=()
          while IFS=$'\t' read -r NAME SIZE URL; do
            [ -n "${NAME:-}" ] || continue
            # 新命名以机型前缀开头；Config-* / immortalwrt-* 分支仅为兼容
            # 轮换前遗留的历史资产，新 Release 已不再产出这类文件。
            case "$NAME" in
              H5000M-*|Config-H5000M-*)        DEV=H5000M ;;
              AP3000M-*|Config-AP3000M-*)      DEV=AP3000M ;;
              X86-*|Config-X86-*|immortalwrt-x86-64*) DEV=X86 ;;
              *)                               DEV=通用 ;;
            esac
            # 用途识别顺序即优先级：明确刷机类型 → rootfs / kernel（含
            # rootfs.img.gz 等，必须先于 .img.gz / .iso 等扩展名兜底判断）→
            # 安装镜像 / 虚拟盘 → 辅助文本
            case "$NAME" in
              sha256sums)    USE="SHA256 校验总表（sha256sum -c）" ;;
              *.sha256)      USE="SHA256 校验值（对应同名固件）" ;;
              *sysupgrade*)  USE="sysupgrade 升级包（保留配置）" ;;
              *factory*)     USE="factory 全新刷机包" ;;
              *initramfs*)   USE="initramfs 临时引导" ;;
              *recovery*)    USE="recovery 救砖包" ;;
              *rootfs*)      USE="rootfs 根文件系统" ;;
              *kernel*)      USE="内核镜像" ;;
              *-efi-iso.iso) USE="UEFI 安装镜像（光盘 / U 盘）" ;;
              *-efi.iso)     USE="UEFI 安装镜像（光盘 / U 盘）" ;;
              *.iso)         USE="BIOS/Legacy 安装镜像（光盘 / U 盘）" ;;
              *-efi.vmdk)    USE="UEFI 虚拟盘（VMware）" ;;
              *.vmdk)        USE="BIOS/Legacy 虚拟盘（VMware）" ;;
              *-efi.img.gz)  USE="UEFI 磁盘镜像（balenaEtcher / dd 写入）" ;;
              *.img.gz)      USE="BIOS/Legacy 磁盘镜像（balenaEtcher / dd 写入）" ;;
              *-efi*)        USE="UEFI 镜像" ;;
              *combined*)    USE="BIOS/Legacy 磁盘镜像" ;;
              Config-*)      USE="编译配置（历史资产）" ;;
              *.manifest)    USE="内置插件清单（历史资产）" ;;
              *)             USE="固件文件" ;;
            esac
            # 体积：≥1MB 显示 MB（一位小数），<1MB 显示 KB（manifest 等小文件）
            if [ "$SIZE" -lt 1048576 ]; then
              SZ="$(( SIZE / 1024 )) KB"
            else
              SZ="$(awk -v s="$SIZE" 'BEGIN{printf "%.1f", s/1048576}') MB"
            fi
            ROWS[$DEV]+="| [\`$NAME\`]($URL) | ${SZ} | ${USE} |"$'\n'
          done < <(gh release view "$WRT_RELEASE_TAG" --json assets \
                     --jq '.assets | sort_by(.name) | .[] | [.name, (.size | tostring), .downloadUrl] | @tsv')

          for DEV in H5000M AP3000M X86 通用; do
            [ -n "${ROWS[$DEV]:-}" ] || continue
            case "$DEV" in
              H5000M)  HEADING="H5000M（Hiveton 5G CPE · MT7987A）" ;;
              AP3000M) HEADING="AP3000M（AirPi · MT7981B）" ;;
              X86)     HEADING="X86（x86_64 虚拟机 / 软路由）" ;;
              *)       HEADING="通用" ;;
            esac
            {
              echo "### ${HEADING}"
              echo
              echo "| 文件 | 大小 | 用途 |"
              echo "| :--- | ---: | :--- |"
              printf '%s' "${ROWS[$DEV]}"
              echo
            } >> "$BODY_DL"
          done

          # ⑤ 组装完整 body 并更新；标题同步美化（Releases 列表页显示中文组名）
          case "$WRT_TAG_GROUP" in
            NetWiz)  TITLE="NetWiz 网络配置向导" ;;
            MT5700)  TITLE="MT5700 模组方案" ;;
            MT5700M) TITLE="MT5700M 模组方案" ;;
            FM350)   TITLE="FM350 模组方案" ;;
            自用)    TITLE="自用构建" ;;
            BASE)    TITLE="基础构建" ;;
            *)       TITLE="$WRT_TAG_GROUP" ;;
          esac
          cat "$BODY_HEAD" "$BODY_DL" "$BODY_TAIL" > "$BODY"
          gh release edit "$WRT_RELEASE_TAG" --title "${TITLE} · ${WRT_RELEASE_TAG#*-}" --notes-file "$BODY"
          rm -f "$BODY_HEAD" "$BODY_TAIL" "$BODY_DL" "$BODY"
